[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Multi-Agent Security Operations Copilot built with RAG, LangGraph and FastAPI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "qdrant-client==1.19.0",
    "fastembed==0.8.0",
    "PyYAML==6.0.3",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-openai==1.6.2",
    "openai==3.13.0",
    "langchain-groq==1.1.3",
    "groq==0.37.1",
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100